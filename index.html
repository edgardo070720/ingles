<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#f6f7fb;--sf:#fff;--tx:#1b2030;--mu:#667085;--pr:#2f5bea;--bd:#dde1ee;--wa:#c77700;--er:#c93a3a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141c;--sf:#1b1f2b;--tx:#e8ebf5;--mu:#98a2b3;--pr:#6c8cff;--bd:#2c3243;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141c;--sf:#1b1f2b;--tx:#e8ebf5;--mu:#98a2b3;--pr:#6c8cff;--bd:#2c3243;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:960px;margin:0 auto;padding:16px}header{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{font-size:20px;margin:0}h2{margin:0 0 6px}h3{margin:0 0 6px}
.c{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
button{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
button.s{background:transparent;color:var(--pr);border:1px solid var(--bd)}button.d{background:var(--er)}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 2px}label.o{display:block;padding:8px;border:1px solid var(--bd);border-radius:8px;margin:4px 0;cursor:pointer;color:var(--tx);font-size:15px}
.o input{width:auto;margin-right:8px}.g{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.t{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--tx)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;min-width:80px}.bar i{display:block;height:100%;background:var(--pr)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:6px;border-bottom:1px solid var(--bd);vertical-align:top}.ov{overflow-x:auto}
.m{background:var(--pr);color:#fff;padding:8px 12px;border-radius:8px;margin:8px 0}audio{max-width:100%}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.np{display:none!important}body{background:#fff;color:#000}.c{break-inside:avoid;border-color:#bbb}}

const dnw=x=>String(x).toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'\s]/g,' ').split(/\s+/).filter(Boolean);
const dl=(a,b)=>{const m=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]};
const dsc=(a,b)=>a==b?0:(a.length>3&&b.length>3&&dl(a,b)<=1?.5:1);
function dcmp(o,g){const A=dnw(o),B=dnw(g),n=A.length,m=B.length,d=[...Array(n+1)].map(()=>Array(m+1).fill(0));for(let i=0;i<=n;i++)d[i][0]=i;for(let j=0;j<=m;j++)d[0][j]=j;

let i=n,j=m;const ops=[];while(i>0||j>0){if(i>0&&j>0&&d[i][j]==d[i-1][j-1]+dsc(A[i-1],B[j-1])){const c=dsc(A[i-1],B[j-1]);ops.unshift([c==0?'ok':c==.5?'near':'sub',A[i-1],B[j-1]]);i--;j--}else if(i>0&&d[i][j]==d[i-1][j]+1){ops.unshift(['del',A[i-1]]);i--}else{ops.unshift(['ins','',B[j-1]]);j--}}

if(S.tab=='dic'){const g=S.dg||1;h+=`<div class="c"><div class="t np"><label style="margin:0">Grado del aspirante</label><select style="width:auto" onchange="S.dg=+this.value;R()">${optG(g)}</select><button class="s" onclick="print()">Imprimir guion</button></div><p class="tag">Lectura sugerida: 1) texto completo a ritmo natural; 2) frase por frase, con pausa para escribir (⏸); 3) texto completo otra vez para revisar. No deletrees ni repitas palabras sueltas.</p></div>${D.qs.filter(q=>q.type=='dict'&&g>=q.g1&&g<=q.g2).sort((a,b)=>L.indexOf(a.lv)-L.indexOf(b.lv)).map(q=>`<div class="c"><div class="t"><span class="tag">${q.lv}</span><span class="tag">${esc(q.tp)}</span><button class="s np" onclick="say('${q.id}')">▶ Voz de apoyo</button><button class="s np" onclick="say('${q.id}',1)">🐢</button></div><p style="font-size:18px;line-height:2">${(q.script.match(/[^.!?]+[.!?]*/g)||[]).map(x=>esc(x.trim())+' <b style="color:var(--pr)">⏸</b>').join('<br>')}</p></div>`).join('')||'<div class="c">No hay dictados para este grado.</div>'}`}
if(S.tab=='top')h+=`<div class="c"><div class="t"><input id="nt" placeholder="Nuevo tema" style="max-width:260px"><button onclick="const v=$('#nt').value.trim();if(v&&!D.topics.includes(v)){D.topics.push(v);save()}R()">Agregar</button></div>${D.topics.map(t=>`<div class="t"><span class="tag">${esc(t)}</span><button class="d" onclick="cf('t${esc(t)}',()=>{D.topics=D.topics.filter(x=>x!=this.dataset.t);save();R()})" data-t="${esc(t)}">Eliminar</button></div>`).join('')}</div>`;
if(S.tab=='set')h+=`<div class="c"><label>% mínimo de aciertos para acreditar un nivel (Reading/Listening)</label><input type="number" min="30" max="100" value="${D.th}" onchange="D.th=+this.value;save()"><label>Voz del Listening (inglés de EE. UU.)</label><select onchange="D.voice=this.value;save()"><option value="">Automática (recomendada)</option>${vs().map(v=>`<option${v.name==D.voice?' selected':''}>${esc(v.name)}</option>`).join('')}</select><p><button class="s" onclick="testV()">▶ Probar voz</button> <span class="tag">${vs().length} voces encontradas en este equipo</span></p><label>PIN docente</label><input value="${esc(D.pin)}" onchange="D.pin=this.value;save()"><p class="tag">Los datos se guardan en este navegador. El PIN es una barrera básica, no seguridad real.</p><p><button class="d" onclick="cf('reset',()=>{localStorage.removeItem('ept3');load();R()})">Restablecer todo</button></p></div>`;return h}
function R(){const m=S.m;S.m='';const ap=['home','test','done'].includes(S.v);let b='';
if(S.v=='home')b=`<div class="c"><img src="${pic('🎓 📚 🌎 🗣️','#e3edff')}" style="width:100%;max-height:120px;border-radius:12px;margin-bottom:8px"><h2>Prueba de nivel de inglés</h2><p>Evaluación alineada al MCER: Reading, Listening, Writing y Speaking.</p><div class="g"><div><label>Nombre completo</label><input id="nm"></div><div><label>Grado al que aspira</label><select id="gr">${optG(1)}</select></div></div><p><button onclick="start()">Comenzar</button></p></div>`;
else if(S.v=='test'){const sk=S.steps[S.i];b=`<div class="c"><div class="t">${S.steps.map((s,i)=>`<span class="tag" style="${i==S.i?'background:var(--pr);color:#fff':''}">${s}</span>`).join('')}</div><img src="${pic(BN[sk],CLR[sk],100)}" style="width:100%;max-height:100px;border-radius:12px;margin-bottom:8px"><h2>${sk}</h2><p>${INS[sk]}</p></div>${qsFor(sk,S.stu.g).map((q,i)=>qh(q,i+1)).join('')}<button onclick="nx()">${S.i<S.steps.length-1?'Siguiente sección →':'Finalizar'}</button>`}
else if(S.v=='done')b='<div class="c"><h2>¡Gracias!</h2><p>Tu prueba fue enviada. El colegio revisará tus resultados y se pondrá en contacto contigo.</p></div>';
else if(S.v=='pin')b=`<div class="c"><h2>Acceso docente</h2><label>PIN</label><input id="pn" type="password" style="max-width:200px"> <p><button onclick="if($('#pn').value==D.pin){S.ok=1;S.v='admin';R()}else toast('PIN incorrecto.')">Entrar</button></p></div>`;
else if(S.v=='admin')b=admin();else if(S.v=='rep')b=rep(D.att.find(a=>a.id==S.ra));
$('#app').innerHTML=`<header class="np"><h1><img src="${LOGO}" alt="Colegio Increart" style="height:34px;vertical-align:middle;background:#fff;border-radius:6px;padding:2px"> English Placement Test</h1><div class="t"><button class="${ap?'':'s'}" onclick="S.v='home';R()">Aspirante</button><button class="${ap?'s':''}" onclick="S.v=S.ok?'admin':'pin';R()">Docente</button></div></header>${m?`<div class="m np">${esc(m)}</div>`:''}${b}`}
load();R();
</script></body></html>
